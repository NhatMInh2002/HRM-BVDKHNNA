spring:
  application:
    name: hrm-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${DB_USERNAME:hrm}
    password: ${DB_PASSWORD:hrm_dev_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

minio:
  endpoint:        ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:hrm_minio}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:hrm_minio_pass}}
  bucket:     hrm-avatars

app:
  jwt:
    secret: ${JWT_SECRET:hrm-bvnghean-secret-key-2025-must-be-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  # URL backend mà tool VGCASignService (chạy trên máy người ký, ngoài trình duyệt)
  # gọi trực tiếp để tải văn bản cần ký và tải văn bản đã ký lên — PHẢI là địa chỉ
  # thực sự truy cập được từ máy người ký (không phải localhost khi deploy thật).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080/api}
  vgca:
    # TẠM TẮT — bật (true) sau khi đã đăng ký/xác thực quyền sử dụng dịch vụ ký
    # số VGCA với Ban Cơ yếu Chính phủ. Khi tắt, VgcaSignController/Service
    # không được đăng ký làm bean và endpoint liên quan không tồn tại.
    enabled: ${VGCA_ENABLED:false}

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    vn.hrm: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
