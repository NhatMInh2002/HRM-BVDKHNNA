# HRM — Nginx reverse proxy + TLS termination
# Dev: dùng self-signed cert (gen-dev-cert.sh). Prod: thay nginx/certs/fullchain.pem
# và nginx/certs/privkey.pem bằng chứng chỉ CA thật (VNPT-CA/Viettel-CA hoặc Let's Encrypt).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # ── Bảo mật chung ───────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Rate limiting (chặn brute-force login) ─────────────────
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;

    upstream frontend_upstream {
        server hrm-frontend:3000;
    }

    # ── HTTP → HTTPS redirect ───────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Đăng nhập — giới hạn chặt hơn
        location /api/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
